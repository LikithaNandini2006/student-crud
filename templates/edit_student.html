<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>
<body>

<h2>Edit Student</h2>

<form method="POST">

<input type="text"
name="name"
value="{{student.name}}">

<input type="number"
name="age"
value="{{student.age}}">

<input type="text"
name="course"
value="{{student.course}}">

<input type="email"
name="email"
value="{{student.email}}">

<button type="submit">
Update
</button>

</form>

</body>
</html>
